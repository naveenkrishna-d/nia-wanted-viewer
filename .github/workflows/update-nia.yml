name: Refresh NIA public data

on:
  schedule:
   # - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nia-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install updater dependencies
        run: pip install -r requirements.txt

      - name: Fetch and validate official NIA data
        run: python scripts/update_nia.py

      - name: Commit verification/update
        if: always()
        run: |
          git config user.name "nia-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/records.json data/status.json data/change_log.json
          if git diff --cached --quiet; then
            echo "No repository changes."
          else
            git commit -m "data: refresh NIA public records"
            git push
          fi
